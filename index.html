<style>

     BÓ HỒNG TOÀN ẢNH — kiểu mâm tròn, gói đen–đỏ, viền baby trắng

     Ảnh: photos/img1.jpg, img2.jpg, ... (đánh số liên tục từ 1)

     ============================================================ */
  :root{ --rose:#ff4d79; --rose-soft:#ff9bb3; --gold:#ffd9a0; --ink:#fff0f4; --glow:rgba(255,120,160,.55); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);text-align:center;
    min-height:100vh;position:relative;overflow-x:hidden;overflow-y:auto;
    background:radial-gradient(120% 120% at 50% 28%,#641630 0%,#360b1d 50%,#120309 100%);}

  .bokeh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bokeh span{position:absolute;border-radius:50%;filter:blur(8px);opacity:.30;
    background:radial-gradient(circle at 30% 30%,#fff,rgba(255,120,160,0));animation:floatB linear infinite;}
  @keyframes floatB{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.15)}100%{transform:translateY(0) scale(1)}}

  #fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;}
  .heart,.spark{position:absolute;will-change:transform,opacity;}
  .heart{font-size:22px;animation:rise linear forwards;}
  @keyframes rise{0%{transform:translateY(0) translateX(0) scale(.6) rotate(0);opacity:0;}10%{opacity:1;}
    100%{transform:translateY(-110vh) translateX(var(--dx)) scale(1.1) rotate(var(--rot));opacity:0;}}
  .spark{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--glow);animation:twk 1.6s ease-in-out infinite;}
  @keyframes twk{0%,100%{transform:scale(.2);opacity:.2}50%{transform:scale(1);opacity:1}}

  #cover{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;
    background:radial-gradient(120% 120% at 50% 30%,#5e1230,#15040b 82%);transition:opacity .9s ease, visibility .9s;}
  #cover.hide{opacity:0;visibility:hidden;}
  .env{font-size:clamp(70px,22vw,120px);filter:drop-shadow(0 0 22px var(--glow));animation:beat 1.6s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .cover-sub{font-size:clamp(15px,4.5vw,20px);color:var(--rose-soft);max-width:84%;line-height:1.5;}
  .open-btn{cursor:pointer;border:none;border-radius:999px;padding:16px 40px;font-size:clamp(16px,5vw,20px);font-weight:700;color:#5e1230;
    background:linear-gradient(135deg,#ffd9a0,#ff9bb3,#ff4d79);box-shadow:0 8px 30px var(--glow);animation:pulse 2s infinite;transition:transform .15s;}
  .open-btn:active{transform:scale(.95);}
  @keyframes pulse{0%{box-shadow:0 8px 30px var(--glow),0 0 0 0 rgba(255,120,160,.55)}70%{box-shadow:0 8px 30px var(--glow),0 0 0 26px rgba(255,120,160,0)}100%{box-shadow:0 8px 30px var(--glow),0 0 0 0 rgba(255,120,160,0)}}

  #stage{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:42px 10px 50px;opacity:0;transition:opacity 1.2s ease .2s;}
  #stage.show{opacity:1;}
  .title{font-size:clamp(21px,6vw,36px);font-weight:800;margin:0 0 4px;
    background:linear-gradient(90deg,#ffd9a0,#ff9bb3,#ff4d79,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shine 6s linear infinite;}
  @keyframes shine{to{background-position:200% center}}
  .subtitle{margin:0 0 10px;color:var(--rose-soft);font-size:clamp(13px,4vw,17px);}

  .bouquet{position:relative;width:min(96vw,470px);aspect-ratio:1240/1740;margin:0 auto;}
  #deco{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
  .rose{position:absolute;border-radius:50%;overflow:hidden;cursor:pointer;border:3px solid rgba(255,255,255,.92);
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    transform:translate(-50%,-50%) scale(0);opacity:0;
    transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .4s;transition-delay:var(--d);}
  .bouquet.bloom .rose{transform:translate(-50%,-50%) scale(1);opacity:1;}
  .bouquet.bloom .rose:hover,.bouquet.bloom .rose:active{transform:translate(-50%,-50%) scale(1.15);
    box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 22px var(--rose);z-index:9999;}
  .rose img{width:100%;height:100%;object-fit:cover;display:block;}

  .hint{color:var(--rose-soft);font-size:clamp(12px,3.6vw,15px);animation:fade 2.5s ease-in-out infinite;margin:8px 0 0;}

  .lb-imgwrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .lb-cap{margin:14px 6px 6px;font-size:clamp(15px,4.4vw,19px);line-height:1.55;}

  .lb-nav{display:flex;justify-content:space-between;margin-top:10px;gap:10px;}

    display:none;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);

  #music.show{display:flex;}

  .sp-imgwrap{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 24px var(--rose);}
  .sp-imgwrap img{width:100%;height:100%;object-fit:cover;}
  .sp-title{font-size:clamp(24px,7vw,34px);font-weight:800;color:#fff0f4;text-shadow:0 2px 14px rgba(255,90,130,.6);margin-bottom:8px;}
  .sp-msg{font-size:clamp(15px,4.4vw,18px);color:#ffd9e3;line-height:1.6;}
  .sp-close{position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:20px;color:#fff;background:linear-gradient(135deg,#ff4d79,#a0123e);box-shadow:0 4px 14px rgba(0,0,0,.4);}
</style>

document.getElementById('title').textContent = CONFIG.title;

const deco = document.getElementById('deco');
let PHOTOS = [];
let roses = [];   // {el,vx,vy,vd}

/* ---------- Tự dò ảnh img1..imgN ---------- */
function probe(i){
  return new Promise(res=>{
    const exts=['jpg','jpeg','png','JPG','JPEG','PNG','webp'];let k=0;
    (function next(){ if(k>=exts.length){res(null);return;}
      const im=new Image();
      im.onload=()=> (im.naturalWidth>0?res(`photos/img${i}.${exts[k]}`):(k++,next()));
      im.onerror=()=>{k++;next();}; im.src=`photos/img${i}.${exts[k]}`; })();
  });
}
async function detectPhotos(){
  const found=[]; let miss=0;
  for(let i=1;i<=CONFIG.maxPhotos;i++){
    const s=await probe(i);
    if(s){found.push(s);miss=0;} else{miss++; if(miss>=3&&found.length>0)break; if(miss>=6)break;}
  }
  return found;
}

/* ---------- Xếp ảnh thành mâm tròn (hex packing) ---------- */
const CX=620, CY=625, RD=365, GRIP=[620,1230];
function packDome(N){
  let s=Math.sqrt(Math.PI*RD*RD/(N*0.84)), pts=[];
  for(let it=0; it<16; it++){
    pts=[]; const Rg=Math.ceil(RD/s)+3;
    for(let gy=-Rg;gy<=Rg;gy++) for(let gx=-Rg;gx<=Rg;gx++){
      const x=(gx+(gy%2?0.5:0))*s, y=gy*s*0.9;
      if(x*x+y*y<=RD*RD) pts.push([x,y,Math.hypot(x,y)]);
    }
    if(pts.length>=N) break; s*=0.93;
  }
  pts.sort((a,b)=>a[2]-b[2]); pts=pts.slice(0,N);
  return {pts,s};
}

/* ---------- Trang trí SVG: halo, giấy gói, baby, nơ, ruy băng ---------- */
function buildDeco(){
  const cx=CX, cy=CY, Rp=540, neckY=Math.round(cy+Rp*0.95), gripY=Math.round(cy+Rp*0.95)+230;
  let s='';
  s+=`<defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="62%"><stop offset="0%" stop-color="rgba(255,140,170,.45)"/><stop offset="70%" stop-color="rgba(255,140,170,0)"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>`;
  s+=`<rect x="0" y="0" width="1240" height="1740" fill="url(#halo)"/>`;

  // --- voan đen xoè sau phần chuôi (cho dày dặn) ---
  s+=`<g filter="url(#soft)">
    <polygon points="${cx-160},${neckY} ${cx-390},1716 ${cx+390},1716 ${cx+160},${neckY}" fill="rgba(12,12,16,.6)"/>
    <polygon points="${cx-95},${neckY} ${cx-250},1716 ${cx+250},1716 ${cx+95},${neckY}" fill="rgba(74,8,22,.5)"/>
  </g>`;

  // --- ruy băng buông (bản to + chữ mờ) ---
  const ribbon=(x,w,col)=>`<path d="M ${cx+x-w/2} ${gripY-30} L ${cx+x+w/2} ${gripY-30} L ${cx+x+w/2+20} 1712 Q ${cx+x} 1690 ${cx+x-w/2+4} 1716 Z" fill="${col}"/>`;
  s+=ribbon(-78,28,'#7a0f24')+ribbon(86,28,'#7a0f24');
  s+=ribbon(-28,48,'#9a1230')+ribbon(32,48,'#9a1230');
  for(const xx of [-28,32]) for(let yy=gripY+34; yy<1690; yy+=44) s+=`<line x1="${cx+xx-17}" y1="${yy}" x2="${cx+xx+17}" y2="${yy}" stroke="rgba(225,195,150,.55)" stroke-width="3"/>`;

  // --- chuôi: bó thân quấn giấy ---
  s+=`<polygon points="${cx-80},${neckY} ${cx+80},${neckY} ${cx+56},${gripY} ${cx-56},${gripY}" fill="#23232a"/>`;
  s+=`<polygon points="${cx-80},${neckY} ${cx-8},${neckY} ${cx-6},${gripY} ${cx-56},${gripY}" fill="#7a0f24"/>`;
  for(let i=1;i<=4;i++){const yy=neckY+(gripY-neckY)*i/5, wf=80-(80-56)*i/5;
    s+=`<path d="M ${(cx-wf).toFixed(0)} ${yy.toFixed(0)} Q ${cx} ${(yy+12).toFixed(0)} ${(cx+wf).toFixed(0)} ${yy.toFixed(0)}" stroke="rgba(18,18,22,.9)" stroke-width="5" fill="none"/>`;}

  // --- giấy gói bo tròn: nền tròn + nếp gấp (scallop) ---
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${Rp}" ry="${Math.round(Rp*0.97)}" fill="#16161a"/>`;
  const nb=26;
  for(let i=0;i<nb;i++){const a=((360/nb)*i-90)*Math.PI/180, r=Rp*0.93;
    const bx=cx+Math.cos(a)*r, by=cy+Math.sin(a)*r*0.97, rr=Rp*0.17;
    s+=`<circle cx="${bx.toFixed(0)}" cy="${by.toFixed(0)}" r="${rr.toFixed(0)}" fill="${i%2?'#96122a':'#1a1a1e'}"/>`;}
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${Math.round(Rp*0.86)}" ry="${Math.round(Rp*0.84)}" fill="none" stroke="#96122a" stroke-width="10"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${Math.round(Rp*0.83)}" ry="${Math.round(Rp*0.81)}" fill="none" stroke="rgba(255,120,150,.45)" stroke-width="4"/>`;

  // --- nơ ở cổ bó ---
  const by2=neckY+6;
  s+=`<g transform="rotate(-20 ${cx-84} ${by2-8})"><ellipse cx="${cx-84}" cy="${by2-8}" rx="86" ry="66" fill="#aa1430"/><ellipse cx="${cx-84}" cy="${by2-8}" rx="56" ry="42" fill="#5e0a1a"/></g>`;
  s+=`<g transform="rotate(20 ${cx+84} ${by2-8})"><ellipse cx="${cx+84}" cy="${by2-8}" rx="86" ry="66" fill="#aa1430"/><ellipse cx="${cx+84}" cy="${by2-8}" rx="56" ry="42" fill="#5e0a1a"/></g>`;
  s+=`<circle cx="${cx}" cy="${by2}" r="34" fill="#46071a" stroke="#aa1430" stroke-width="6"/>`;

  // --- hoa baby dày (collar tròn) ---
  let rnd=12345; const rand=()=>{rnd=(rnd*1103515245+12345)&0x7fffffff;return rnd/0x7fffffff;};
  for(const ring of [[RD*1.0,92],[RD*1.1,80],[RD*1.2,66]]){
    const ringR=ring[0], nn=ring[1];
    for(let i=0;i<nn;i++){const a=i/nn*2*Math.PI, rr=ringR+(rand()*18-9);
      const bxx=cx+Math.cos(a)*rr, byy=cy+Math.sin(a)*rr*0.97;
      for(let k=0;k<3;k++){const ox=rand()*20-10,oy=rand()*20-10,cr=4+rand()*4;
        s+=`<circle cx="${(bxx+ox).toFixed(0)}" cy="${(byy+oy).toFixed(0)}" r="${cr.toFixed(0)}" fill="#fffdfe"/>`;}}
  }
  deco.innerHTML=s;
}

/* ---------- Dựng mâm hồng ---------- */
let PACK=null;
function buildBouquet(){
  const N=PHOTOS.length||5;
  buildDeco();
  PACK=packDome(N);
  roses=[];
  // thứ tự nở: từ tâm ra ngoài
  PACK.pts.forEach((p,idx)=>{
    const [x,y,rdist]=p;
    const el=document.createElement('div'); el.className='rose';
    el.style.zIndex=String(Math.round(2000-rdist));
    el.style.setProperty('--d',(0.03*idx)+'s');
    const img=document.createElement('img'); img.src=PHOTOS[idx]; img.alt=''; el.appendChild(img);
    if(idx===0){ el.classList.add('special'); el.addEventListener('click',openSpecial); }
    else el.addEventListener('click',()=>openLightbox(idx));
    bouquet.appendChild(el);
    const dia=PACK.s*1.08*(1-0.10*(rdist/RD));
    roses.push({el, vx:CX+x, vy:CY+y, vd:dia});
  });
  layout(); window.addEventListener('resize',layout);
}
function layout(){
  const scale=bouquet.clientWidth/1240;
  roses.forEach(r=>{ r.el.style.width=(r.vd*scale)+'px'; r.el.style.height=(r.vd*scale)+'px';
    r.el.style.left=(r.vx*scale)+'px'; r.el.style.top=(r.vy*scale)+'px'; });
}

/* ---------- Bokeh ---------- */
(function(){const b=document.getElementById('bokeh');
  for(let i=0;i<12;i++){const sp=document.createElement('span');const sz=20+Math.random()*90;
    sp.style.width=sp.style.height=sz+'px';sp.style.left=Math.random()*100+'%';sp.style.top=Math.random()*100+'%';
    sp.style.animationDuration=(6+Math.random()*8)+'s';sp.style.animationDelay=(-Math.random()*8)+'s';b.appendChild(sp);} })();

/* ---------- Mưa tim + lấp lánh ---------- */
const fx=document.getElementById('fx');const HEARTS=['💗','❤️','💕','🌹','✨','💖'];let fxOn=false;
function spawnHeart(){if(!fxOn)return;const h=document.createElement('div');h.className='heart';
  h.textContent=HEARTS[Math.floor(Math.random()*HEARTS.length)];h.style.left=Math.random()*100+'vw';h.style.bottom='-30px';
  h.style.fontSize=(14+Math.random()*22)+'px';h.style.setProperty('--dx',(Math.random()*120-60)+'px');
  h.style.setProperty('--rot',(Math.random()*120-60)+'deg');h.style.animationDuration=(5+Math.random()*5)+'s';fx.appendChild(h);setTimeout(()=>h.remove(),10000);}
function spawnSpark(){if(!fxOn)return;const sp=document.createElement('div');sp.className='spark';
  sp.style.left=Math.random()*100+'vw';sp.style.top=Math.random()*100+'vh';sp.style.animationDuration=(1+Math.random()*1.6)+'s';fx.appendChild(sp);setTimeout(()=>sp.remove(),2800);}
setInterval(spawnHeart,460);setInterval(spawnSpark,320);
function burst(x,y){for(let i=0;i<18;i++){const h=document.createElement('div');h.className='heart';
  h.textContent=HEARTS[Math.floor(Math.random()*HEARTS.length)];h.style.left=x+'px';h.style.bottom=(window.innerHeight-y)+'px';
  h.style.fontSize=(16+Math.random()*20)+'px';h.style.setProperty('--dx',(Math.random()*280-140)+'px');
  h.style.setProperty('--rot',(Math.random()*160-80)+'deg');h.style.animationDuration=(2.4+Math.random()*2)+'s';fx.appendChild(h);setTimeout(()=>h.remove(),4600);}}

/* ---------- Mở quà ---------- */
const cover=document.getElementById('cover'),stage=document.getElementById('stage'),musicBtn=document.getElementById('music');
let musicOn=true;
function runIntro(done){
  const el=document.getElementById('introText');
  const l1=CONFIG.introLine1, l2=CONFIG.introLine2;
  el.innerHTML='<span id="it1"></span><span class="cursor">▍</span>';
  const t1=document.getElementById('it1'); let i=0;
  (function a(){ if(i<=l1.length){t1.textContent=l1.slice(0,i);i++;setTimeout(a,75);}
    else{ el.innerHTML=`<span>${l1}</span><span class="l2" id="it2"></span><span class="cursor">▍</span>`;
      const t2=document.getElementById('it2'); let j=0;
      (function b(){ if(j<=l2.length){t2.textContent=l2.slice(0,j);j++;setTimeout(b,55);} else setTimeout(done,1400); })();
    } })();
}
document.getElementById('openBtn').addEventListener('click',()=>{
  cover.classList.add('hide');fxOn=true;musicBtn.classList.add('show');
  bgm.volume=0;
  bgm.play().then(()=>{let v=0;const f=setInterval(()=>{v=Math.min(0.6,v+0.03);bgm.volume=v;if(v>=0.6)clearInterval(f);},120);})
            .catch(()=>{musicBtn.textContent='🔈';musicOn=false;});
  const intro=document.getElementById('intro'); intro.classList.add('show');
  runIntro(()=>{ intro.classList.remove('show'); stage.classList.add('show');
    burst(window.innerWidth/2,window.innerHeight/2);
    setTimeout(()=>bouquet.classList.add('bloom'),250); });
});
musicBtn.addEventListener('click',()=>{musicOn=!musicOn;if(musicOn){bgm.play().catch(()=>{});musicBtn.textContent='🔊';}else{bgm.pause();musicBtn.textContent='🔈';}});

/* ---------- Lightbox ---------- */
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap');let cur=0;
function capOf(i){return (CONFIG.captions&&CONFIG.captions[i])?CONFIG.captions[i]:CONFIG.defaultCaption;}
function openLightbox(i){cur=i;renderLB();lb.classList.add('open');burst(window.innerWidth/2,window.innerHeight*0.4);}
function renderLB(){lbImg.src=PHOTOS[cur]||'';lbCap.textContent=capOf(cur);}
document.getElementById('lbClose').addEventListener('click',()=>lb.classList.remove('open'));
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open');});
document.getElementById('lbPrev').addEventListener('click',()=>{cur=(cur-1+PHOTOS.length)%PHOTOS.length;renderLB();});
document.getElementById('lbNext').addEventListener('click',()=>{cur=(cur+1)%PHOTOS.length;renderLB();});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowLeft'){cur=(cur-1+PHOTOS.length)%PHOTOS.length;renderLB();}
  if(e.key==='ArrowRight'){cur=(cur+1)%PHOTOS.length;renderLB();}});

/* ---------- Bông đặc biệt ở giữa ---------- */
const special=document.getElementById('special');
function openSpecial(){
  document.getElementById('spImg').src=PHOTOS[0]||'';
  document.getElementById('spTitle').textContent=CONFIG.specialTitle;
  document.getElementById('spMsg').textContent=CONFIG.specialMsg;
  special.classList.add('open');
  burst(window.innerWidth/2,window.innerHeight*0.4);
}
document.getElementById('spClose').addEventListener('click',()=>special.classList.remove('open'));
special.addEventListener('click',e=>{if(e.target===special)special.classList.remove('open');});

/* ---------- Khởi động ---------- */
(async function init(){
  PHOTOS = await detectPhotos();
  if(PHOTOS.length===0){ for(let i=0;i<7;i++) PHOTOS.push('photos/img1.jpg'); }
  buildBouquet();
})();
</script>
